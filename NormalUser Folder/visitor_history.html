<head>
  <title>Visitor History - OMDS</title>
  <link rel="stylesheet" href="../css/NormalUser/dashCSS2.css" />
  <link rel="stylesheet" href="../css/NormalUser/visitor_history.css" />
</head>

<!--VISITOR HISTORY-->

<div class="parent-container">
  <div class="child-container1">
    <div class="child-container3">
      <div class="upperVis">
        <div class="column-title">Visitor History</div>

        <!-- FILTER SECTION -->
        <div class="sub-title">Search Visitor History</div>

        <div class="filters">
          <input
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="10"
            id="idFilter"
            class="filter-input"
            placeholder="Personnel ID"
          />

          <input
            type="text"
            class="filter-input"
            id="birthdate"
            placeholder="Birthdate"
            onfocus="this.type = 'date'"
            onblur="if (!this.value) this.type = 'text';"
          />

          <button class="search-button">Search</button>
        </div>

        <!-- VISITOR HISTORY TABLE -->
        <div class="sub-title">Visitor Records</div>
      </div>
      <div class="lowerVis">
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>No.</th>
                <th>Date</th>
                <th>Time</th>
                <th>Visitor Name</th>
                <th>Visitor ID</th>
              </tr>
            </thead>
            
            <tbody id="visitorTable"></tbody>
          </table>
        </div>
        <div id="paginationContainer"></div>
      </div>
    </div>
  </div>
</div>
<script src="javascript/NormalUser/visitor_history.js"></script>
